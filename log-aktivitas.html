<script src="js/config.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const check = await guardPage(['admin', 'kepsek']);
        if (!check) return;

        loadLogs();
    });

    async function loadLogs() {
        const container = document.getElementById('log-container');
        container.innerHTML = `<p class="text-on-surface-variant text-sm text-center"><span class="material-symbols-outlined animate-spin text-sm">sync</span> Memuat log aktivitas...</p>`;

        try {
            const res = await apiPost('getLogAktivitas', { token: getToken() });
            if (res.ok && res.data) {
                renderLogs(res.data);
            } else {
                container.innerHTML = `<p class="text-error text-sm text-center">Gagal memuat log: ${res.error || 'Terjadi kesalahan'}</p>`;
            }
        } catch (e) {
            container.innerHTML = `<p class="text-error text-sm text-center">Gagal terhubung ke server</p>`;
        }
    }

    function renderLogs(logs) {
        const container = document.getElementById('log-container');
        if (!logs || logs.length === 0) {
            container.innerHTML = `<p class="text-on-surface-variant text-sm text-center">Belum ada aktivitas tercatat.</p>`;
            return;
        }

        let html = '';
        logs.forEach(log => {
            html += `
                <div class="flex items-start gap-4 p-4 rounded-lg bg-surface-container-low border border-outline-variant/40">
                    <div class="p-2.5 bg-primary/10 text-primary rounded-lg">
                        <span class="material-symbols-outlined text-xl">history</span>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between items-center">
                            <span class="font-title-md text-sm text-on-surface">${log.nama || 'System'} <span class="font-normal text-on-surface-variant">(${log.action})</span></span>
                            <span class="text-xs text-on-surface-variant">${log.waktu || ''}</span>
                        </div>
                        <p class="text-xs text-on-surface-variant mt-1">${log.detail || '-'}</p>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }
</script>
